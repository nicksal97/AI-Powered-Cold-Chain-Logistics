[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coldchain"
version = "1.0.0"
description = "Agentic decision support for cold-chain logistics: SOP-grounded RAG, rule-based excursion detection, LangGraph agent behind a FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nikhil Ramchandra Salunkhe" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38", "httpx>=0.27"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
coldchain = "coldchain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coldchain"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a Postgres+pgvector database (TEST_DATABASE_URL)"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
