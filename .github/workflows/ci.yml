name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coldchain
          POSTGRES_PASSWORD: coldchain
          POSTGRES_DB: coldchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coldchain" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://coldchain:coldchain@localhost:5432/coldchain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest --cov=coldchain --cov-report=term-missing --cov-report=xml
      - name: Retrieval eval gate (offline embedder, no keys)
        env:
          COLDCHAIN_DATABASE_URL: postgresql+psycopg://coldchain:coldchain@localhost:5432/coldchain
          COLDCHAIN_EMBEDDING_PROVIDER: hash
          COLDCHAIN_EMBEDDING_DIM: "384"
        run: |
          coldchain migrate
          coldchain ingest-sop
          python evals/run_evals.py retrieval --min-hit1 0.8
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-reports, path: evals/reports/ }

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., target: ui, push: false, cache-from: type=gha }
